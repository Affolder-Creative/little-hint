name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to retry, for example v0.1.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: little-hint-release
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'Affolder-Creative/little-hint' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ inputs.tag }}
        run: node scripts/release-ref.mjs select
  prepare:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ needs.select.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check main has not moved before release generation
        id: freshness
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ needs.select.outputs.sha }}
        run: node scripts/release-ref.mjs check-main
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push' && steps.freshness.outputs.current == 'true'
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: resolve
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          CHECKED_SHA: ${{ needs.select.outputs.sha }}
        run: node scripts/release-ref.mjs resolve
  checks:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
  image:
    needs: [prepare, checks]
    if: needs.prepare.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/affolder-creative/little-hint
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/source-cache
          key: sources-${{ hashFiles('compliance/source-materials.json') }}
          restore-keys: sources-
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reuse already published bytes when retrying
        id: reuse
        run: bash scripts/release-image.sh find
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.reuse.outputs.found != 'true'
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=.local/image.oci.tar
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
      - name: Load the exact image and collect compliance evidence
        run: bash scripts/release-image.sh load
      - name: Container smoke test
        env:
          LITTLE_HINT_IMAGE: little-hint:release
        run: bash scripts/smoke-image.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: little-hint:release
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: little-hint:release
          format: spdx-json
          output: .local/release/image.spdx.json
          exit-code: "0"
      - name: Assemble and verify reviewed corresponding-source bundles
        run: node scripts/release-sources.mjs .local/release/compliance
      - name: Save Docker-loadable image and compliance bundle
        run: bash scripts/release-image.sh archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: .local/release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-audit-${{ matrix.arch }}
          path: .local/release/compliance/
          retention-days: 7
  publish:
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/affolder-creative/little-hint
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: .local/artifacts
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish verified images and release downloads
        run: bash scripts/publish-release.sh
