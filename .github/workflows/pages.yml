name: Marketing site

on:
  pull_request:
    paths:
      - "marketing/**"
      - "scripts/check-marketing.mjs"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "scripts/check-marketing.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate static site
        run: node scripts/check-marketing.mjs
      - name: Explain disabled deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED != 'true'
        run: echo 'Site validation passed. Deployment is disabled. Configure GitHub Pages and set the PAGES_ENABLED repository variable to true to publish.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload only the marketing website
        uses: actions/upload-pages-artifact@v5
        with:
          path: marketing
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
