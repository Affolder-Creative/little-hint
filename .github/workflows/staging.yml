name: Staging image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted repository branch or full commit SHA to build"
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: little-hint-staging-image
  cancel-in-progress: false
jobs:
  image:
    # Keep the workflow itself on main; select feature code with the ref input.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve selected commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish staging image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            VERSION=staging
            REVISION=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-amd64
          cache-to: type=gha,mode=max,scope=staging-amd64
      - name: Report the exact deployment image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Commit: `%s`\n\nSet this runtime value in the staging Coolify resource, then deploy:\n\n```text\nLITTLE_HINT_STAGING_IMAGE=%s@%s\n```\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
