name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.select.outputs.integration }}
      browser: ${{ steps.select.outputs.browser }}
      containers: ${{ steps.select.outputs.containers }}
      brand: ${{ steps.select.outputs.brand }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select checks from the complete PR diff
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ inputs.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-policy.mjs select
  quality:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      brand: ${{ steps.brand.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tooling
      - run: python3 scripts/test_bundle_sources.py
      - run: npm run licenses:check
      - name: Audit brand tooling without regenerating artwork
        id: brand
        if: needs.changes.outputs.brand == 'true'
        run: |
          npm ci --prefix brand/little-hint-final/source --ignore-scripts
          node scripts/licenses.mjs .local/brand-compliance brand/little-hint-final/source
          python3 -m venv .local/brand-audit
          .local/brand-audit/bin/python -m pip install -r brand/little-hint-final/source/requirements.txt
          .local/brand-audit/bin/python scripts/audit-brand.py
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:compose
      - name: Validate workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/actionlint
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --pattern 'actionlint_1.7.12_checksums.txt' --dir .local/actionlint
          cd .local/actionlint
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check --strict
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd ../..
          .local/actionlint/actionlint -shellcheck=''
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: little_hint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: little_hint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U little_hint -d little_hint_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://little_hint:ci-only@localhost:5432/little_hint_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Create isolated staging test database
        run: |
          docker exec $(docker ps -q --filter ancestor=postgres:18-alpine) psql -U little_hint -d little_hint_test -v ON_ERROR_STOP=1 -c "CREATE ROLE little_hint_staging LOGIN PASSWORD 'ci-staging-only'" -c "CREATE DATABASE little_hint_staging OWNER little_hint_staging"
      - run: npm run test:staging-integration
        env:
          STAGING_TEST_DATABASE_URL: postgres://little_hint_staging:ci-staging-only@localhost:5432/little_hint_staging
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, sign-in, list-features, group-events, polish, pwa]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: little_hint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: little_hint_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U little_hint -d little_hint_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://little_hint:ci-only@localhost:5432/little_hint_e2e
      BETTER_AUTH_SECRET: ci-browser-only-secret-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      UPLOAD_DIR: .local/uploads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Browser suite with isolated fixtures
        env:
          SUITE: ${{ matrix.suite }}
        run: npm run test:browser:ci -- "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/source-cache
          key: sources-${{ hashFiles('compliance/source-materials.json') }}
          restore-keys: sources-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: little-hint:ci
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Verify image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect little-hint:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - name: Container smoke test
        env:
          LITTLE_HINT_IMAGE: little-hint:ci
        run: bash scripts/smoke-image.sh
      - name: Staging stack smoke test
        if: matrix.arch == 'amd64'
        env:
          LITTLE_HINT_STAGING_IMAGE: little-hint:ci
        run: bash scripts/smoke-staging.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: little-hint:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify corresponding-source bundles against the actual image
        run: |
          mkdir -p .local/ci-compliance
          container=$(docker create little-hint:ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/compliance-report/." .local/ci-compliance/
          node scripts/release-sources.mjs .local/ci-compliance
  gate:
    name: CI gate
    if: always()
    needs: [changes, quality, integration, browser, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs gate
