name: Security audit
on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm audit --omit=dev --audit-level=high
      - id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/registry-tags.mjs > .local/registry-tags.json
          node -e 'const fs=require("fs"); const exists=JSON.parse(fs.readFileSync(".local/registry-tags.json")).includes("latest"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`exists=${exists}\n`); if(!exists) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"No published latest image yet; npm audit completed.\n")'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.image.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.image.outputs.exists == 'true'
        with:
          image-ref: ghcr.io/affolder-creative/little-hint:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
