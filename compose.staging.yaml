# Standalone stack. Do not merge with the production Compose definition.
# Coolify requires literal bind paths; local smoke tests override them.
name: little-hint-staging
x-app: &app
  image: ${LITTLE_HINT_STAGING_IMAGE:?Set LITTLE_HINT_STAGING_IMAGE to the staging image digest}
  pull_policy: missing
  restart: unless-stopped
  environment:
    NODE_ENV: production
    APP_ENV: staging
    CLOUDFLARE_WEB_ANALYTICS: ${CLOUDFLARE_WEB_ANALYTICS:-false}
    APP_URL: ${STAGING_APP_URL:?Set STAGING_APP_URL to the staging HTTPS origin}
    DATABASE_URL: postgresql://little_hint_staging:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@db:5432/little_hint_staging
    BETTER_AUTH_SECRET: ${STAGING_AUTH_SECRET:?Set STAGING_AUTH_SECRET}
    SETTINGS_ENCRYPTION_KEY: ${STAGING_ENCRYPTION_KEY:?Set STAGING_ENCRYPTION_KEY}
    PORT: 3000
    UPLOAD_DIR: /data/uploads
    FAMILY_GROUP_CREATION: ${FAMILY_GROUP_CREATION:-}
    PRODUCT_IMAGE_CACHE_ENABLED: ${PRODUCT_IMAGE_CACHE_ENABLED:-}
    PRODUCT_IMAGE_PREFETCH_ENABLED: ${PRODUCT_IMAGE_PREFETCH_ENABLED:-}
    AUTO_IMPORT_PRODUCT_PHOTOS: ${AUTO_IMPORT_PRODUCT_PHOTOS:-}
    PRODUCT_IMPORT_CACHE_ENABLED: ${PRODUCT_IMPORT_CACHE_ENABLED:-true}
    STAGING_SCRAPING_PROVIDER: ${STAGING_SCRAPING_PROVIDER:-auto}
    STAGING_BRIGHTDATA_API_KEY: ${STAGING_BRIGHTDATA_API_KEY:-}
    STAGING_BRIGHTDATA_UNLOCKER_ZONE: ${STAGING_BRIGHTDATA_UNLOCKER_ZONE:-}
    STAGING_SCRAPINGFISH_API_KEY: ${STAGING_SCRAPINGFISH_API_KEY:-}
    STAGING_SCRAPINGBEE_API_KEY: ${STAGING_SCRAPINGBEE_API_KEY:-}
    STAGING_SCRAPEDO_API_KEY: ${STAGING_SCRAPEDO_API_KEY:-}
    STAGING_SCRAPINGDOG_API_KEY: ${STAGING_SCRAPINGDOG_API_KEY:-}
    STAGING_OPENAI_API_KEY: ${STAGING_OPENAI_API_KEY:-}
    STAGING_OPENAI_MODEL: ${STAGING_OPENAI_MODEL:-gpt-6-luna}
    STAGING_GIFT_DISCOVERY_USER_OVERRIDES: ${STAGING_GIFT_DISCOVERY_USER_OVERRIDES:-}
    STAGING_GIFT_DISCOVERY_MODE: ${STAGING_GIFT_DISCOVERY_MODE:-off}
    STAGING_GIFT_DISCOVERY_MODEL: ${STAGING_GIFT_DISCOVERY_MODEL:-gpt-6-luna}
    STAGING_GIFT_DISCOVERY_USER_WEEKLY_LIMIT: ${STAGING_GIFT_DISCOVERY_USER_WEEKLY_LIMIT:-3}
    STAGING_GIFT_DISCOVERY_MONTHLY_LIMIT: ${STAGING_GIFT_DISCOVERY_MONTHLY_LIMIT:-20}
    STAGING_SMS_ENABLED: ${STAGING_SMS_ENABLED:-false}
    STAGING_TELEGRAM_ENABLED: ${STAGING_TELEGRAM_ENABLED:-false}
    STAGING_TELEGRAM_BOT_TOKEN: ${STAGING_TELEGRAM_BOT_TOKEN:-}
    STAGING_TELEGRAM_BOT_NAME: ${STAGING_TELEGRAM_BOT_NAME:-}
    STAGING_SMS_PROVIDER: ${STAGING_SMS_PROVIDER:-none}
    STAGING_TEXTBELT_API_KEY: ${STAGING_TEXTBELT_API_KEY:-}
    STAGING_SMS_MONTHLY_LIMIT: ${STAGING_SMS_MONTHLY_LIMIT:-100}
    STAGING_SMS_USER_DAILY_LIMIT: ${STAGING_SMS_USER_DAILY_LIMIT:-2}
    STAGING_SMS_CREDIT_RESERVE: ${STAGING_SMS_CREDIT_RESERVE:-20}
    STAGING_SMS_ALLOWED_EVENTS: ${STAGING_SMS_ALLOWED_EVENTS:-exchange,access}
    STAGING_TWILIO_ACCOUNT_SID: ${STAGING_TWILIO_ACCOUNT_SID:-}
    STAGING_TWILIO_AUTH_TOKEN: ${STAGING_TWILIO_AUTH_TOKEN:-}
    STAGING_TWILIO_FROM: ${STAGING_TWILIO_FROM:-}
    STAGING_TWILIO_VERIFY_SERVICE_SID: ${STAGING_TWILIO_VERIFY_SERVICE_SID:-}
    STAGING_PAID_DAILY_LIMIT: ${STAGING_PAID_DAILY_LIMIT:-10}
    NODE_EXTRA_CA_CERTS: /run/mailpit-ca.crt
  volumes:
    - staging-uploads:/data/uploads
    - /data/little-hint-staging/tls/ca.crt:/run/mailpit-ca.crt:ro
  read_only: true
  tmpfs:
    - /tmp:size=128M,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: little_hint_staging
      POSTGRES_USER: little_hint_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
    volumes:
      - staging-postgres18:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, pg_isready -U little_hint_staging -d little_hint_staging]
      interval: 5s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_UI_AUTH: ${STAGING_MAILPIT_UI_AUTH:?Set STAGING_MAILPIT_UI_AUTH to username:password}
      MP_SMTP_TLS_CERT: /run/mailpit-tls/mailpit.crt
      MP_SMTP_TLS_KEY: /run/mailpit-tls/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - staging-mail:/data
      - /data/little-hint-staging/tls/mailpit.crt:/run/mailpit-tls/mailpit.crt:ro
      - /data/little-hint-staging/tls/mailpit.key:/run/mailpit-tls/mailpit.key:ro
    expose: ["8025", "1025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  app:
    <<: *app
    mem_limit: 512m
    command:
      [
        sh,
        -c,
        "node dist/server/cli.js migrate && exec node dist/server/index.js",
      ]
    expose: ["3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  worker:
    <<: *app
    mem_limit: 256m
    command: [node, dist/server/worker.js]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/little-hint-worker-heartbeat','utf8'))<60000?0:1)}catch{process.exit(1)}",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  staging-postgres18:
  staging-uploads:
  staging-mail:
