# Standalone, launcher-owned stack. Never merge with production/staging Compose.
x-app: &app
  image: ${PREVIEW_PROJECT:?Run npm run preview}:app
  pull_policy: never
  restart: unless-stopped
  env_file: ./.local/preview/runtime.env
  volumes:
    - uploads:/data/uploads
    - ./.local/preview/tls/ca.crt:/run/mailpit-ca.crt:ro
  networks: [private]
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: little_hint_preview
      POSTGRES_DB: little_hint_preview
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?Run npm run preview}
    volumes: [database:/var/lib/postgresql]
    networks: [private]
    healthcheck:
      test:
        [CMD-SHELL, pg_isready -U little_hint_preview -d little_hint_preview]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /__preview/inbox/
      MP_MAX_MESSAGES: 1000
      MP_SMTP_TLS_CERT: /tls/mailpit.crt
      MP_SMTP_TLS_KEY: /tls/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    volumes:
      - mail:/data
      - ./.local/preview/tls/mailpit.crt:/tls/mailpit.crt:ro
      - ./.local/preview/tls/mailpit.key:/tls/mailpit.key:ro
    networks: [private]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  app:
    <<: *app
    build:
      context: .
      args:
        VERSION: ${PREVIEW_VERSION:-development}
        REVISION: ${PREVIEW_REVISION:-unknown}
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
  worker:
    <<: *app
    command: [node, dist/server/worker.js]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/little-hint-worker-heartbeat','utf8'))<60000?0:1)}catch{process.exit(1)}",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
  gateway:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    ports:
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
    volumes: [./.local/preview/gateway:/etc/caddy:ro]
    networks: [private, edge]
    healthcheck:
      test:
        [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/__preview/health]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The upstream Caddy binary carries this file capability even on port 8080.
    cap_add: [NET_BIND_SERVICE]
  tunnel:
    image: cloudflare/cloudflared@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    profiles: [share]
    restart: "no"
    command:
      [
        tunnel,
        --no-autoupdate,
        --url,
        http://gateway:8080,
        --metrics,
        0.0.0.0:2000,
      ]
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  tls:
    image: alpine/openssl:3.5.4
    profiles: [tools]
    entrypoint: [sh, /scripts/tls.sh]
    volumes:
      - ./scripts/preview/tls.sh:/scripts/tls.sh:ro
      - ./.local/preview/tls:/tls
    network_mode: none
volumes:
  database:
  uploads:
  mail:
networks:
  private:
    internal: true
  edge:
