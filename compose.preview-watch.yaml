# Launcher-selected override. Runtime secrets are never passed to Vite.
x-watch: &watch
  image: ${PREVIEW_PROJECT}:watch
  environment:
    CHOKIDAR_USEPOLLING: "true"
    CHOKIDAR_INTERVAL: "300"
  volumes:
    - ./src/server:/app/src/server:ro
    - ./src/shared:/app/src/shared:ro
    - ./public:/app/public:ro
services:
  app:
    <<: *watch
    build:
      dockerfile: Dockerfile.preview-watch
      target: backend
    command:
      [
        node,
        node_modules/tsx/dist/cli.mjs,
        watch,
        --clear-screen=false,
        --include,
        ./src/server,
        --include,
        ./src/shared,
        src/server/index.ts,
      ]
  worker:
    <<: *watch
    command:
      [
        node,
        node_modules/tsx/dist/cli.mjs,
        watch,
        --clear-screen=false,
        --include,
        ./src/server,
        --include,
        ./src/shared,
        src/server/worker.ts,
      ]
  frontend:
    image: ${PREVIEW_PROJECT}:frontend
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.preview-watch
      target: frontend
    restart: unless-stopped
    env_file: ./.local/preview/frontend.env
    environment:
      NODE_ENV: development
    volumes:
      - ./src/client:/app/src/client:ro
      - ./src/shared:/app/src/shared:ro
      - ./public:/app/public:ro
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
